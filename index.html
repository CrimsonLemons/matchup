<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MatchUp</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22MatchUp%22,%22short_name%22:%22MatchUp%22,%22display%22:%22standalone%22,%22start_url%22:%22.%22,%22background_color%22:%22%230E3A4C%22,%22theme_color%22:%22%230E3A4C%22}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --court-deep: #16241C;
    --court-mid: #1E3226;
    --line-white: #F3ECDC;
    --ball: #E3603F;
    --on-ball: #F8F3E6;
    --text: #F3ECDC;
    --text-dim: #A9BBA8;
    --card-bg: rgba(243,236,220,0.06);
    --card-border: rgba(243,236,220,0.16);
    --danger: #E3603F;
    --radius: 4px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--court-deep) 0%, var(--court-mid) 100%);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 18px 64px; }

  header.top {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid var(--line-white); padding-bottom: 14px; margin-bottom: 22px;
  }
  header.top h1 { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 28px; margin: 0; }
  header.top .sub { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; }
  header.top .court-tag {
    font-family: 'Oswald', sans-serif; font-size: 13px; color: var(--ball);
    border: 1.5px solid var(--ball); padding: 3px 9px; border-radius: var(--radius); white-space: nowrap;
  }

  section { margin-bottom: 30px; }
  section h2 { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 15px; margin: 0 0 12px; }

  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; }

  label { display: block; font-size: 12px; color: var(--text-dim); margin: 12px 0 5px; }
  label:first-of-type { margin-top: 0; }

  select, input[type="date"], input[type="time"], input[type="text"], textarea {
    width: 100%; background: rgba(0,0,0,0.15); border: 1px solid var(--card-border);
    color: var(--text); border-radius: var(--radius); padding: 10px 11px; font-size: 15px; font-family: inherit;
  }
  select:focus, input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ball); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 54px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  button {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
    border-radius: var(--radius); border: none; padding: 11px 16px; cursor: pointer;
  }
  .btn-primary { background: var(--ball); color: var(--on-ball); width: 100%; margin-top: 16px; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-ghost { background: transparent; border: 1px solid var(--card-border); color: var(--text); }
  .btn-danger-outline { background: transparent; border: 1px solid var(--danger); color: var(--danger); font-size: 12.5px; padding: 6px 10px; }
  .toggle-form { background: transparent; border: 1px solid var(--ball); color: var(--ball); width: 100%; }

  .match-card { margin-bottom: 12px; }
  .match-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .match-when { font-family: 'Oswald', sans-serif; font-size: 19px; font-weight: 600; }
  .match-kind { font-size: 11.5px; color: var(--text-dim); }
  .slots { font-family: 'Oswald', sans-serif; font-size: 13px; color: var(--ball); border: 1px solid var(--ball); border-radius: var(--radius); padding: 2px 8px; white-space: nowrap; }
  .slots.full { color: var(--text-dim); border-color: var(--card-border); }
  .match-meta { font-size: 13px; color: var(--text-dim); margin-top: 6px; }
  .match-note { font-size: 13.5px; margin-top: 8px; }
  .participants { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pill { background: rgba(0,0,0,0.15); border-radius: 20px; padding: 4px 10px; font-size: 12.5px; }
  .match-actions { display: flex; gap: 8px; margin-top: 12px; }
  .match-actions button { flex: 1; }

  .empty { color: var(--text-dim); font-size: 13.5px; text-align: center; padding: 26px 10px; border: 1px dashed var(--card-border); border-radius: var(--radius); }
  .notice { font-size: 13px; color: var(--text-dim); }
  .players-list { display: flex; flex-wrap: wrap; gap: 8px; }
  #new-form { display: none; margin-top: 14px; }
  #new-form.open { display: block; }

  #onboard {
    position: fixed; inset: 0; background: var(--court-deep);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10;
  }
  #onboard .card { max-width: 360px; width: 100%; }
</style>
</head>
<body>

<div id="onboard">
  <div class="card">
    <h2 style="font-family:'Oswald',sans-serif;">Tere tulemast! 🎾</h2>
    <p class="notice">Sisesta oma nimi — seda näevad teised, kui postitad üleskutse või liitud mänguga.</p>
    <label for="onboard-name">Sinu nimi</label>
    <input type="text" id="onboard-name" placeholder="nt Reili">
    <label for="onboard-level">Sinu tase</label>
    <select id="onboard-level">
      <option value="">— vali —</option>
      <option>Algaja</option>
      <option>IV liiga</option>
      <option>III liiga</option>
      <option>II liiga</option>
    </select>
    <button class="btn-primary" id="onboard-save">Alusta</button>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div>
      <h1>MatchUp</h1>
      <div class="sub">Märgi endale mäng — keegi tuleb kaasa</div>
    </div>
    <span class="court-tag">avatud üleskutsed</span>
  </header>
